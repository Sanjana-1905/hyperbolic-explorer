<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: draw under the notch / camera cut-out (the interface keeps clear of it with the --sai-* safe-area variables below).
         interactive-widget=resizes-content: the on-screen keyboard shrinks the page (the search box relies on that). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- Browser bar colour on Android: the scene's background colour (THEME.CLEAR_COLOR is 0x03040c; the body is #05060a) -->
    <meta name="theme-color" content="#03040c" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Installed to the home screen ("Add to Home screen") it opens fullscreen with no address bar -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Hyperbolic Data Explorer</title>
    <style>
      :root {
        /* Safe-area insets (notch, rounded corners, gesture bar). Every fixed piece of interface adds these to its margins. */
        --sai-t: env(safe-area-inset-top, 0px);
        --sai-r: env(safe-area-inset-right, 0px);
        --sai-b: env(safe-area-inset-bottom, 0px);
        --sai-l: env(safe-area-inset-left, 0px);
        --ui-o: 1;                         /* interface opacity, driven by idlefade.js (1 = shown, 0 = faded away) */
      }
      /* Full-bleed page: exactly the visible window (100dvh follows Chrome's collapsing address bar), never scrolls or bounces. */
      html, body { margin: 0; height: 100%; height: 100dvh; background: #05060a; overflow: hidden; overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent; }
      body { position: fixed; inset: 0; width: 100%; -webkit-text-size-adjust: 100%; }
      /* touch-action: none is on the canvas only (navigation.js and below), so the code panel, search results and cards still scroll. */
      /* The interface fades while you only look (idlefade.js). Faded things stop catching touches, so the touch reaches the picture. */
      #tools, #info, #crumbs, #map, #card, #legend { opacity: var(--ui-o); }
      .ui-hidden #tools, .ui-hidden #info, .ui-hidden #crumbs, .ui-hidden #map, .ui-hidden #card, .ui-hidden #legend { pointer-events: none !important; }
      @media (prefers-reduced-motion: reduce) { #tools, #info, #crumbs, #map, #card, #legend { transition: none; } }
      body { font-family: system-ui, sans-serif; color: #e8ecf5; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      /* Info overlay showing the focused node's name and path */
      #info {
        position: fixed; top: calc(12px + max(var(--study-h, 0px), var(--sai-t))); left: calc(12px + var(--sai-l)); right: calc(12px + var(--sai-r) + var(--panel-w, 0px) + var(--legend-w, 0px));
        pointer-events: none;
        text-shadow: 0 0 4px #000;
      }
      #info .name { font-size: 20px; font-weight: 600; }
      #info .path { font-size: 13px; opacity: 0.75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #help {
        position: fixed; bottom: calc(10px + var(--sai-b)); left: calc(12px + var(--sai-l));
        font-size: 12px; opacity: 0.55; pointer-events: none;
      }
      @media (max-height: 520px) { /* phone held sideways: slimmer text so the picture keeps the room */
        #info { top: calc(6px + max(var(--study-h, 0px), var(--sai-t))); left: calc(12px + var(--sai-l)); }
        #info .name { font-size: 15px; }
        #info .path { font-size: 11px; word-break: normal; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #crumbs { bottom: calc(6px + var(--sai-b)) !important; font-size: 11px !important; max-width: calc(100vw - var(--panel-w, 0px) - 120px) !important; }
      }
      @media (pointer: coarse) { #help { display: none; } } /* touch screens: the keys line is useless, the toolbar replaces it */
      #fps {
        position: fixed; top: calc(12px + var(--sai-t)); right: calc(12px + var(--sai-r));
        font: 12px ui-monospace, monospace; color: #9fe870;
        background: rgba(0, 0, 0, 0.5); padding: 2px 6px; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="info"><div class="name">Loading…</div><div class="path"></div></div>
    <div id="help"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
